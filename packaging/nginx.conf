# Served inside the existing trusted-IP HTTPS subscription server.
location = /traffic/api/updates/status {
    auth_basic "Private VPN traffic";
    auth_basic_user_file /etc/vpn-traffic/htpasswd;
    proxy_pass http://127.0.0.1:9082/status;
    proxy_set_header Authorization "";
    proxy_connect_timeout 3s;
    proxy_read_timeout 8s;
    access_log off;
    limit_except GET { deny all; }
}
location = /traffic { return 308 /traffic/; }
location ^~ /traffic/ {
    auth_basic "Private VPN traffic";
    auth_basic_user_file /etc/vpn-traffic/htpasswd;
    proxy_pass http://127.0.0.1:9081/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Authorization "";
    proxy_set_header Connection "";
    proxy_connect_timeout 3s;
    proxy_read_timeout 95s;
    proxy_buffering off;
    access_log off;
    client_max_body_size 16k;
    limit_except GET POST { deny all; }
}
