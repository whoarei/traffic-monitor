name: CI and Release

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Test and build Debian package
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      version: ${{ steps.version.outputs.version }}
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      TZ: Asia/Shanghai
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate version and release tag
        id: version
        env:
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          if [[ -n "$RELEASE_TAG" ]]; then
            version=$(python3 scripts/check_version.py --tag "$RELEASE_TAG")
          else
            version=$(python3 scripts/check_version.py)
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Check Python, JavaScript, and package script syntax
        run: |
          python3 -m compileall -q app scripts build.py build_deliverables.py build_technical_document.py
          node --check web/app.js
          for script in packaging/postinst packaging/prerm packaging/postrm; do
            sh -n "$script"
          done

      - name: Run unit tests
        run: python3 -m unittest discover -s tests -v

      - name: Run dashboard browser regression
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
          npm run test:web

      - name: Build and verify release assets
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          python3 build.py --output dist
          package="dist/vpn-traffic_${RELEASE_VERSION}_all.deb"
          test "$(dpkg-deb --field "$package" Version)" = "$RELEASE_VERSION"
          test "$(dpkg-deb --field "$package" Architecture)" = all
          dpkg-deb --info "$package"
          dpkg-deb --extract "$package" "$RUNNER_TEMP/vpn-traffic-package"
          python3 "$RUNNER_TEMP/vpn-traffic-package/usr/lib/vpn-traffic/main.py" --help > /dev/null
          git archive --format=tar --prefix="vpn-traffic-${RELEASE_VERSION}/" HEAD |
            gzip -n > "dist/vpn-traffic-${RELEASE_VERSION}-source.tar.gz"
          cp docs/technical-design.html "dist/vpn-traffic-${RELEASE_VERSION}-technical-design.html"
          cp docs/technical-design.md "dist/vpn-traffic-${RELEASE_VERSION}-technical-design.md"
          cd dist
          sha256sum "vpn-traffic_${RELEASE_VERSION}_all.deb" \
            "vpn-traffic_${RELEASE_VERSION}_all.deb.sha256" \
            "vpn-traffic-${RELEASE_VERSION}-source.tar.gz" \
            "vpn-traffic-${RELEASE_VERSION}-technical-design.html" \
            "vpn-traffic-${RELEASE_VERSION}-technical-design.md" > SHA256SUMS
          sha256sum --check SHA256SUMS
          sha256sum --check "vpn-traffic_${RELEASE_VERSION}_all.deb.sha256"

      - name: Upload build artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vpn-traffic-${{ steps.version.outputs.version }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14
          overwrite: true

  release:
    name: Publish GitHub Release
    needs: build
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ github.ref_name }}
      RELEASE_VERSION: ${{ needs.build.outputs.version }}
    steps:
      - name: Download tested build artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: vpn-traffic-${{ needs.build.outputs.version }}
          path: dist

      - name: Verify downloaded assets
        working-directory: dist
        run: |
          sha256sum --check SHA256SUMS
          sha256sum --check "vpn-traffic_${RELEASE_VERSION}_all.deb.sha256"

      - name: Create or complete release
        run: |
          if gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft > "$RUNNER_TEMP/release-state"; then
            if [[ "$(cat "$RUNNER_TEMP/release-state")" != true ]]; then
              echo "Release $RELEASE_TAG is already published; keeping its existing assets."
              exit 0
            fi
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft \
              --title "VPN Traffic ${RELEASE_VERSION}" --generate-notes \
              --notes "包含 Debian/Ubuntu 安装包、SHA256 校验、源码包及 Markdown/离线 HTML 技术方案。安装前需已有本项目约定的 Xray 与 HTTPS 私人订阅部署，操作方法见 README。版本变更见 https://github.com/${GH_REPO}/blob/${RELEASE_TAG}/CHANGELOG.md 。此流程不自动部署服务器。"
          fi
          gh release upload "$RELEASE_TAG" dist/* --clobber
          gh release edit "$RELEASE_TAG" --draft=false --latest
